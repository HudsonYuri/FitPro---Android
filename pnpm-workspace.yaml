packages:
  - "apps/*"
  - "packages/*"

catalog:
  typescript: ~6.0.3
  zod: ^4.6.7
  vitest: ^5.0.4
  vite: ^8.3.4

minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.11.8"
  - "@turbo/darwin-arm64@2.11.8"
  - "@turbo/linux-64@2.11.8"
  - "@turbo/linux-arm64@2.11.8"
  - "@turbo/windows-64@2.11.8"
  - "@turbo/windows-arm64@2.11.8"
  - turbo@2.11.8
  - "@expo/cli@57.0.30"
  - "@expo/prebuild-config@57.0.19"
  - expo-asset@57.0.20
  - expo-constants@57.0.22
  - expo-modules-autolinking@57.0.16
  - expo-modules-core@57.0.23
  - expo@57.0.29
  - "@react-navigation/bottom-tabs@7.21.0"
  - "@react-navigation/core@7.24.0"
  - "@react-navigation/elements@2.9.45"
  - "@react-navigation/native-stack@7.21.0"
  - "@react-navigation/native@7.5.1"
  - "@react-navigation/routers@7.6.5"
  - expo-notifications@57.0.23

# Metro resolve melhor com node_modules "hoisted" num monorepo pnpm.
nodeLinker: hoisted
autoInstallPeers: false
